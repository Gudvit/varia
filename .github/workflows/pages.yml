name: Публикация отчёта на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные публикации не нужны: важен результат последнего пуша.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Страницы пересобираются из Markdown-источников, а не берутся из коммита,
      # чтобы опубликованная версия всегда соответствовала источнику.
      - run: npm run build

      - name: Собрать каталог публикации
        run: |
          mkdir -p _site
          cp index.html analysis.html _site/
          cp final_report.md analysis.md _site/
          cp -R assets _site/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
